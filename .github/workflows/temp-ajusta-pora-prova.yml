name: Ajusta PORA Prova

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Executa ajuste PORA prova 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar somente Aula 08 de PORA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pora/index.html')
          s = p.read_text(encoding='utf-8')

          ini = s.find('<!-- AULA 08 — 1ª PROVA -->')
          if ini == -1:
              raise SystemExit('Início da Aula 08 não encontrado; abortando.')
          fim = s.find('<!-- AULA 09', ini)
          if fim == -1:
              raise SystemExit('Fim do bloco da Aula 08 não encontrado; abortando.')

          bloco = s[ini:fim]
          bloco2 = bloco.replace('17/09/2026','22/09/2026',1)

          if 'Prova objetiva.' not in bloco2:
              alvo = 'e Rotinas Administrativas.'
              pos = bloco2.find(alvo)
              if pos == -1:
                  raise SystemExit('Descrição da prova não encontrada; abortando.')
              pos += len(alvo)
              bloco2 = bloco2[:pos] + '\n\n                <br>\n                <strong>Prova objetiva.</strong>' + bloco2[pos:]

          if 'Prova às 19h30' not in bloco2:
              raise SystemExit('Horário esperado da prova não encontrado; abortando.')

          s2 = s[:ini] + bloco2 + s[fim:]
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pora/index.html
          git commit -m "Ajusta Aula 08 de PORA para prova objetiva em 22-09 às 19h30 [skip ci]"
          git push
