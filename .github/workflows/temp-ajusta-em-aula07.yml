name: Ajusta EM Aula 07

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Executa ajuste EM Aula 07'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir Aula 07 e inserir apostila
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('em/index.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(r'''          <!-- AULA 07 -->.*?          <!-- AULA 08 - PROVA -->''', re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Bloco da Aula 07 não encontrado; abortando.')

          novo = '''          <!-- AULA 07 -->

          <div class="material-item">

            <div class="material-icon">
              📕
            </div>

            <div class="material-info">

              <span class="lesson-date">
                10/09/2026
              </span>

              <strong>
                Aula 07 — Estrutura de Mercado
              </strong>

              <span>
                Estudo das estruturas de mercado e suas principais características.
              </span>

            </div>

            <a
              class="material-btn"
              href="https://1drv.ms/b/c/050c9a98ff922c79/IQBk4aDQL7_HQaZsiWk1iYBLAae9IHEEAvRE3_l9pyuTYkY?e=4c2QgU"
              target="_blank"
              rel="noopener noreferrer"
            >
              Abrir PDF
            </a>

          </div>

          <!-- AULA 08 - PROVA -->'''

          s = s[:m.start()] + novo + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add em/index.html
          git commit -m "Corrige Aula 07 para Estrutura de Mercado e adiciona apostila [skip ci]"
          git push
