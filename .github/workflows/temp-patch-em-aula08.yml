name: Temp patch EM Aula 08

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temp patch Aula 08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir observacao sem alterar o restante
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('em/index.html')
          s = p.read_text(encoding='utf-8')
          if 'Observação: Prova será realizada no dia 22/09 (Prova objetiva).' in s:
              raise SystemExit('Observação já existe; nada a fazer.')
          pattern = re.compile(r'(Aula 08 — DIA DA 1ª PROVA.*?Prova às 19h30 —\s*jantar servido às 19h\.\s*</strong>)', re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Trecho da Aula 08 não encontrado; abortando para não alterar conteúdo indevido.')
          insert = m.group(1) + '''
                <br>
                <strong>
                  Observação: Prova será realizada no dia 22/09 (Prova objetiva).
                </strong>'''
          s = s[:m.start(1)] + insert + s[m.end(1):]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add em/index.html
          git commit -m "Adiciona observação da prova objetiva na Aula 08 [skip ci]"
          git push
