<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carregando ATD2 — Aplicativos Informatizados</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f6f8;color:#333}
.box{max-width:560px;margin:24px;padding:28px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.08);text-align:center}
.box strong{color:#b5121b}
</style>
</head>
<body>
<div class="box" id="loading"><strong>ETEC — ATD2 AI</strong><p>Carregando a interface da atividade...</p></div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/advjuniorpedrocolombo-arch/1-TANE_IBIUNA/c7a49a3773e36e39bb6cdb11d9127ab1c79ff029/ai/atividades/atd2-abnt/index.html?ts='+Date.now();
    const r=await fetch(base,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();

    const endpointAntigo='https://script.google.com/macros/s/AKfycbwIP3xPyvkTdU6AMTicNAFH2Evw460RuSFnsSyVmxpVkQlddQ9qowBQDS8O5wqX6dg7/exec';
    const endpointNovo='https://script.google.com/macros/s/AKfycby-MZxAUKGvhDtHLKJ2r3CV7i98C2hzADA2ezfvbZ19mX8JzMk1ucTr59JrVmxNGsFF/exec';

    html=html.split(endpointAntigo).join(endpointNovo);

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<strong>Não foi possível carregar a ATD2.</strong><p>'+String(e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
