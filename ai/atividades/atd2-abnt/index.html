<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATD2 — Aplicativos Informatizados</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f6f8;color:#333}.box{max-width:620px;margin:24px;padding:30px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.08);text-align:center}.box strong{color:#b5121b;font-size:1.15rem}.box p{line-height:1.55}.hour{font-size:1.4rem;font-weight:900;color:#b5121b}.muted{color:#667085;font-size:.9rem}.back{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:10px;background:#b5121b;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="box" id="loading"><strong>ETEC — ATD2 AI</strong><p>Consultando o horário oficial da atividade...</p></div>
<script>
(async()=>{
  const SCRIPT_URL='https://script.google.com/macros/s/AKfycby-MZxAUKGvhDtHLKJ2r3CV7i98C2hzADA2ezfvbZ19mX8JzMk1ucTr59JrVmxNGsFF/exec';
  const ABERTURA=Date.parse('2026-09-08T21:00:00-03:00');
  const ENCERRAMENTO=Date.parse('2026-09-08T22:30:00-03:00');
  const box=document.getElementById('loading');
  const PREVIEW=new URLSearchParams(location.search).get('preview')==='1';

  async function statusOficial(){
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),5000);
      const r=await fetch(SCRIPT_URL+'?ts='+Date.now(),{cache:'no-store',signal:controller.signal});
      clearTimeout(timer);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(j && (j.status==='AGUARDANDO'||j.status==='DISPONIVEL'||j.status==='ENCERRADA')) return j;
      throw new Error('Resposta sem status da janela');
    }catch(_){
      const agora=Date.now();
      return {
        status: agora<ABERTURA?'AGUARDANDO':(agora>=ENCERRAMENTO?'ENCERRADA':'DISPONIVEL'),
        aberto: agora>=ABERTURA&&agora<ENCERRAMENTO,
        fallback:true
      };
    }
  }

  const janela=await statusOficial();

  if(!PREVIEW && janela.status==='AGUARDANDO'){
    box.innerHTML='<strong>ATD2 — Aplicativos Informatizados</strong><p>A atividade ainda não está disponível.</p><div class="hour">Abertura hoje às 21h00</div><p class="muted">08/09/2026 — horário de São Paulo. A liberação ocorrerá automaticamente.</p><a class="back" href="../../index.html">Voltar</a>';
    return;
  }

  if(!PREVIEW && janela.status==='ENCERRADA'){
    box.innerHTML='<strong>ATD2 — ENCERRADA</strong><p>O período de realização e envio foi encerrado.</p><div class="hour">Encerramento: 22h30</div><p class="muted">08/09/2026 — horário de São Paulo.</p><a class="back" href="../../index.html">Voltar</a>';
    return;
  }

  try{
    const base='https://raw.githubusercontent.com/advjuniorpedrocolombo-arch/1-TANE_IBIUNA/c7a49a3773e36e39bb6cdb11d9127ab1c79ff029/ai/atividades/atd2-abnt/index.html?ts='+Date.now();
    const r=await fetch(base,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();

    const endpointAntigo='https://script.google.com/macros/s/AKfycbwIP3xPyvkTdU6AMTicNAFH2Evw460RuSFnsSyVmxpVkQlddQ9qowBQDS8O5wqX6dg7/exec';
    html=html.split(endpointAntigo).join(SCRIPT_URL);

    const avisoSimulado=`<div style="margin:18px 0 16px;padding:18px 20px;border:3px solid #2563eb;border-radius:16px;background:#eff6ff;color:#1e3a8a;box-shadow:0 10px 24px rgba(37,99,235,.10);font-family:Arial,Helvetica,sans-serif">
      <div style="font-size:1.08rem;font-weight:900;margin-bottom:8px">🎯 ESTA ATD2 É UM SIMULADO PARA A PROVA</div>
      <div style="font-size:.94rem;line-height:1.55;font-weight:700">A atividade foi preparada para treinar o mesmo tipo de organização, atenção à formatação e trabalho sob tempo que será exigido na avaliação.</div>
      <div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:#2563eb;color:white;font-size:.9rem;font-weight:900;text-align:center">NA PROVA: ATIVIDADE INDIVIDUAL • TEMPO: 20 MINUTOS</div>
      <div style="margin-top:9px;font-size:.88rem;line-height:1.45">Aproveite os <strong>40 minutos desta ATD2</strong> para treinar o procedimento completo e identificar suas dificuldades antes da prova.</div>
    </div>`;

    const avisoPC=`<div id="pcCheckAlert" style="margin:18px 0 20px;padding:18px 20px;border:3px solid #b5121b;border-radius:16px;background:#fff1f2;color:#7f1d1d;box-shadow:0 10px 24px rgba(181,18,27,.12);font-family:Arial,Helvetica,sans-serif">
      <div style="font-size:1.05rem;font-weight:900;margin-bottom:8px">🚨 ATENÇÃO ANTES DE INICIAR</div>
      <div style="font-size:.94rem;line-height:1.55;font-weight:700">Certifique-se de que este computador possui <strong>Microsoft Word ou outro editor compatível capaz de criar e salvar o arquivo em PDF</strong>.</div>
      <div style="margin-top:8px;font-size:.9rem;line-height:1.5">Após clicar em <strong>INICIAR ATD2</strong>, o cronômetro começa imediatamente. <strong>Problemas com o computador, ausência do Word, troca de máquina ou fechamento da página não reiniciam o tempo.</strong></div>
      <div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:#b5121b;color:white;font-size:.88rem;font-weight:900;text-align:center">VERIFIQUE O COMPUTADOR ANTES DE CLICAR EM INICIAR</div>
    </div>`;

    html=html.replace('<aside class="panel" id="loginPanel">',avisoSimulado+avisoPC+'<aside class="panel" id="loginPanel">');

    const extras=`<script>
      const URL_STATUS_ATD2='${SCRIPT_URL}';
      const MODO_PREVIEW=${PREVIEW ? 'true' : 'false'};

      function aplicarPreviewATD2(){
        if(!MODO_PREVIEW)return;
        const aviso=document.createElement('div');
        aviso.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#fff3cd;color:#664d03;border-bottom:1px solid #ffecb5;padding:10px 14px;text-align:center;font:700 14px Arial,sans-serif';
        aviso.textContent='MODO DE PRÉ-VISUALIZAÇÃO DO PROFESSOR — a atividade oficial continua fechada e nenhum envio será aceito antes das 21h.';
        document.body.appendChild(aviso);
        document.body.style.paddingTop='44px';

        const bloquearEnvio=()=>{
          const e=document.getElementById('sendBtn');
          if(e){
            e.disabled=true;
            e.textContent='ENVIO DESABILITADO NO MODO DE PRÉ-VISUALIZAÇÃO';
            e.title='O envio real só será liberado no horário oficial.';
          }
        };
        bloquearEnvio();
        setInterval(bloquearEnvio,1000);
      }

      async function verificarFechamentoATD2(){
        if(MODO_PREVIEW)return;
        try{
          const r=await fetch(URL_STATUS_ATD2+'?ts='+Date.now(),{cache:'no-store'});
          const j=await r.json();
          if(j.status==='ENCERRADA'){
            const s=document.getElementById('startBtn');
            const e=document.getElementById('sendBtn');
            if(s){s.disabled=true;s.textContent='ATD2 ENCERRADA';}
            if(e){e.disabled=true;e.textContent='PRAZO DE ENVIO ENCERRADO';}
          }
        }catch(_){
          if(Date.now()>=${ENCERRAMENTO}){
            const s=document.getElementById('startBtn');
            const e=document.getElementById('sendBtn');
            if(s){s.disabled=true;s.textContent='ATD2 ENCERRADA';}
            if(e){e.disabled=true;e.textContent='PRAZO DE ENVIO ENCERRADO';}
          }
        }
      }

      aplicarPreviewATD2();
      verificarFechamentoATD2();
      setInterval(verificarFechamentoATD2,15000);
    <\/script>`;
    html=html.replace('</body>',extras+'</body>');

    document.open();document.write(html);document.close();
  }catch(e){
    box.innerHTML='<strong>Não foi possível carregar a ATD2.</strong><p>'+String(e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
