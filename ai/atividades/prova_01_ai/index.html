<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carregando 1ª Prova — Aplicativos Informatizados</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f6f8;color:#333}
.box{max-width:560px;margin:24px;padding:28px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.08);text-align:center}
.box strong{color:#b5121b}
</style>
</head>
<body>
<div class="box" id="loading"><strong>ETEC — PROVA AI</strong><p>Carregando a interface da avaliação...</p></div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/advjuniorpedrocolombo-arch/1-TANE_IBIUNA/main/ai/ai%20/%20atividades%20/%20prova_01_ai%20/index.html?ts='+Date.now();
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);

    let html=await r.text();

    const tarefaAntiga='Copie o texto abaixo para o <strong>Microsoft Word ou editor similar</strong> e produza um documento acadêmico contendo <strong>capa, folha de rosto e o texto integral formatado conforme as normas ABNT trabalhadas em aula</strong>. Ao finalizar, <strong>salve/exporte o trabalho em PDF</strong>. O arquivo enviado para correção deverá ser obrigatoriamente em <strong>formato PDF</strong>.';
    const tarefaNova='Copie o texto sorteado abaixo para o <strong>Microsoft Word ou editor similar</strong> e desenvolva/formate o documento conforme as orientações trabalhadas em aula. Ao finalizar, <strong>salve/exporte o arquivo em PDF</strong> para realizar a entrega.';
    html=html.replace(tarefaAntiga,tarefaNova);

    html=html.replace(
      '<script src="upload.js"></'+'script>',
      '<script src="https://advjuniorpedrocolombo-arch.github.io/1-TANE_IBIUNA/ai/atividades/prova_01_ai/upload.js?v=20260906-04"></'+'script>'
    );

    document.open();
    document.write(html);
    document.close();

  }catch(e){
    document.getElementById('loading').innerHTML='<strong>Não foi possível carregar a prova.</strong><p>'+String(e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
