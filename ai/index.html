```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI — Aplicativos Informatizados</title>
</head>

<body>

<div id="loader" style="font-family:Arial,sans-serif;padding:32px;text-align:center">
  Carregando Aplicativos Informatizados...
</div>

<script>
(async()=>{

  try{

    const fonte='https://raw.githubusercontent.com/advjuniorpedrocolombo-arch/1-TANE_IBIUNA/0dca89911beb42b3055ff211fd60fc92d9271014/ai/index.html?ts='+Date.now();

    const r=await fetch(fonte,{cache:'no-store'});

    if(!r.ok){
      throw new Error('HTTP '+r.status);
    }

    let html=await r.text();


    html=html.replace(
      'ATD2 — Formatação ABNT',
      'ATD2 — AI'
    );


    html=html.replace(
      'Liberação para envio no dia da aula:\n                <strong>08/09/2026</strong>.',
      'Disponível hoje, <strong>10/09/2026</strong>, das <strong>21h00 às 22h30</strong>.'
    );


    html=html.replace(
      '🔒 Liberação no dia da aula',
      '⏰ Abertura às 21h00'
    );


    const botaoAntigo=`<span
              class="activity-button disabled"
              aria-disabled="true"
              title="Liberação no dia da aula — 08/09/2026"
            >
              🔒 Liberação em 08/09
            </span>`;


    const botaoNovo=`<a
              id="atd2AutoBtn"
              class="activity-button disabled"
              aria-disabled="true"
              href="atividades/atd2-abnt/index.html"
              title="ATD2 AI — 10/09/2026 das 21h00 às 22h30"
            >
              ⏰ Abertura às 21h00
            </a>`;


    html=html.replace(
      botaoAntigo,
      botaoNovo
    );


    const autoScript=`<script>

      (function(){

        const STATUS_URL='https://script.google.com/macros/s/AKfycby-MZxAUKGvhDtHLKJ2r3CV7i98C2hzADA2ezfvbZ19mX8JzMk1ucTr59JrVmxNGsFF/exec';

        const ABERTURA=Date.parse(
          '2026-09-10T21:00:00-03:00'
        );

        const ENCERRAMENTO=Date.parse(
          '2026-09-10T22:30:00-03:00'
        );


        function aplicarEstado(status){

          const b=document.getElementById(
            'atd2AutoBtn'
          );

          if(!b){
            return;
          }


          if(status==='AGUARDANDO'){

            b.classList.add('disabled');

            b.setAttribute(
              'aria-disabled',
              'true'
            );

            b.setAttribute(
              'href',
              'atividades/atd2-abnt/index.html'
            );

            b.textContent=
              '⏰ Abertura às 21h00';

            b.style.background=
              '#c8cdd5';

          }


          else if(status==='DISPONIVEL'){

            b.classList.remove(
              'disabled'
            );

            b.removeAttribute(
              'aria-disabled'
            );

            b.setAttribute(
              'href',
              'atividades/atd2-abnt/index.html'
            );

            b.textContent=
              'ACESSAR ATD2 — DISPONÍVEL';

            b.style.background=
              '#237a42';

          }


          else{

            b.classList.add(
              'disabled'
            );

            b.setAttribute(
              'aria-disabled',
              'true'
            );

            b.removeAttribute(
              'href'
            );

            b.textContent=
              '🔒 ATD2 ENCERRADA';

            b.style.background=
              '#c8cdd5';

          }

        }



        async function atualizarATD2(){

          try{

            const r=await fetch(
              STATUS_URL+
              '?ts='+
              Date.now(),
              {
                cache:'no-store'
              }
            );


            const j=await r.json();


            if(
              j.status==='AGUARDANDO' ||
              j.status==='DISPONIVEL' ||
              j.status==='ENCERRADA'
            ){

              aplicarEstado(
                j.status
              );

              return;

            }


            throw new Error(
              'Status inválido'
            );


          }catch(_){


            const agora=
              Date.now();


            aplicarEstado(

              agora<ABERTURA

                ? 'AGUARDANDO'

                : (
                    agora>=ENCERRAMENTO

                      ? 'ENCERRADA'

                      : 'DISPONIVEL'
                  )

            );

          }

        }


        atualizarATD2();


        setInterval(
          atualizarATD2,
          15000
        );


      })();

    <\/script>`;


    html=html.replace(
      '</body>',
      autoScript+'</body>'
    );


    document.open();

    document.write(
      html
    );

    document.close();


  }catch(e){


    document
      .getElementById('loader')
      .innerHTML=
        '<strong>Não foi possível carregar a página.</strong><br>'+
        String(
          e.message||e
        );

  }

})();

</script>

</body>
</html>
```
